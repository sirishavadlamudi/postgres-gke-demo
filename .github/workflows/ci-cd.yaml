name: CI/CD to GKE (Postgres Demo)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}
  GAR_LOCATION: us-central1
  IMAGE_NAME: postgres-app

jobs:
  build-deploy:
    name: Build and Deploy to GKE
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Authenticate to Google Cloud using service account key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3️⃣ Set up gcloud CLI
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      # 4️⃣ Configure Docker to use Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # 5️⃣ Build and push Docker image
      - name: Build and Push Docker image
        run: |
          IMAGE_URI=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/demo-repo/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_URI ./app
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # 6️⃣ Connect to GKE cluster
      - name: Connect to GKE
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.PROJECT_ID }}

      # 7️⃣ Update Kubernetes manifests with new image
      - name: Update Deployment with new image
        run: |
          kubectl set image deployment/app-deployment app=${{ env.IMAGE_URI }} --namespace=default || echo "Deployment will be created in next step"

      # 8️⃣ Apply Kubernetes manifests (creates or updates)
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/postgres-statefulset.yaml
          kubectl apply -f k8s/app-deployment.yaml
          kubectl apply -f k8s/app-service.yaml

      # 9️⃣ Verify deployment rollout
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/app-deployment --timeout=120s
          kubectl get pods
          kubectl get svc

name: CI/CD to GKE (Postgres Demo)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GCP_PROJECT: sirisha-test1
  GKE_CLUSTER: gke-demo-cluster
  GKE_ZONE: us-central1-a
  REGION: us-central1
  REPOSITORY: postgres-gke-demo
  IMAGE: postgres-app
  IMAGE_URI: us-central1-docker.pkg.dev/sirisha-test1/postgres-gke-demo/postgres-app:${{ github.sha }}

jobs:
  build-deploy:
    name: Build and Deploy to GKE
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3️⃣ Set up gcloud CLI
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          install_components: gke-gcloud-auth-plugin

      # 4️⃣ Configure Docker for Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 5️⃣ Build and push Docker image
      - name: Build and Push Docker image
        run: |
          docker build -t ${{ env.IMAGE_URI }} ./app
          docker push ${{ env.IMAGE_URI }}

      # 6️⃣ Connect to GKE cluster
      - name: Connect to GKE
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.GCP_PROJECT }}

      # 7️⃣ Update Deployment with new image (if exists)
      - name: Update Deployment image
        run: |
          kubectl set image deployment/app-deployment app=${{ env.IMAGE_URI }} --namespace=default || echo "Deployment not found, will be created."

      # 8️⃣ Apply Kubernetes manifests
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/postgres-statefulset.yaml
          kubectl apply -f k8s/app-deployment.yaml
          kubectl apply -f k8s/app-service.yaml

      # 9️⃣ Verify Deployment rollout
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/app-deployment --timeout=120s
          kubectl get pods
          kubectl get svc
